name: DB diagnostics (read-only)

# Manual only. Runs a fixed set of read-only SELECTs against the database and
# prints them to the run log, so data questions can be answered without giving
# anyone a direct connection. No inputs, no writes.
#
# Edit the SQL below before dispatching when you need a specific check; it's
# meant to be a scratch tool, not a stable report.

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set."
            exit 1
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          \echo '=== headline counts ==='
          SELECT (SELECT count(*) FROM public.members)      AS members,
                 (SELECT count(*) FROM public.transactions) AS all_txns;

          \echo '=== transactions per fund ==='
          SELECT f.code, count(*) AS txns, sum(t.amount) AS total
          FROM public.transactions t
          JOIN public.funds f ON f.id = t.fund_id
          GROUP BY f.code ORDER BY f.code;
          SQL
