name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch: {}

# Never let two deploys overlap.
concurrency:
  group: supabase-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sanity-check the secret is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set. Create one at https://supabase.com/dashboard/account/tokens and add it as a repo secret."
            exit 1
          fi

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF=$(grep '^project_id' supabase/config.toml | cut -d'"' -f2)
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            echo "::group::Deploying $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
