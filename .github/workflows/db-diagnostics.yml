name: DB diagnostics (read-only)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set."
            exit 1
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          \echo '=== meetings totals ==='
          SELECT (SELECT count(*) FROM public.meetings) meetings,
                 (SELECT count(*) FROM public.meeting_agenda_items) agenda,
                 (SELECT count(*) FROM public.meeting_next_agenda_items) next_agenda,
                 (SELECT count(*) FROM public.meeting_attendance) attendance,
                 (SELECT count(*) FROM public.meeting_attendance WHERE is_present) present;

          \echo '=== meeting 1 sample ==='
          SELECT meeting_no, meeting_date, location, duration FROM public.meetings WHERE meeting_no = 1;

          \echo '=== meeting 1 attendance ==='
          SELECT mem.full_name FROM public.meeting_attendance ma
          JOIN public.meetings m ON m.id = ma.meeting_id
          JOIN public.members mem ON mem.id = ma.member_id
          WHERE m.meeting_no = 1 AND ma.is_present ORDER BY mem.full_name;

          \echo '=== accounts and roles ==='
          SELECT p.email, p.full_name, p.is_active, p.created_at,
                 (SELECT array_agg(r.role ORDER BY r.role) FROM public.user_roles r WHERE r.user_id = p.user_id) AS roles
          FROM public.admin_profiles p
          ORDER BY p.created_at DESC;

          \echo '=== Md Nurullah subscriptions ==='
          SELECT f.name AS fund, s.monthly_amount, s.start_date, s.is_active
          FROM public.member_fund_subscriptions s
          JOIN public.members m ON m.id = s.member_id
          JOIN public.funds f ON f.id = s.fund_id
          WHERE m.full_name = 'Md Nurullah';

          \echo '=== Md Nurullah monthly-fund transactions: txn_date vs for_month ==='
          SELECT f.name AS fund, t.txn_date, t.for_month, t.amount
          FROM public.transactions t
          JOIN public.members m ON m.id = t.member_id
          JOIN public.funds f ON f.id = t.fund_id
          WHERE m.full_name = 'Md Nurullah' AND f.is_one_time = false
          ORDER BY t.for_month;
          SQL
