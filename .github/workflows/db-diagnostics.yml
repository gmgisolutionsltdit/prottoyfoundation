name: DB diagnostics (read-only)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set."
            exit 1
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          \echo '=== members contact fields ==='
          SELECT member_no, mobile, email, reference_person
          FROM public.members ORDER BY member_no;

          \echo '=== member_types table ==='
          SELECT id, name FROM public.member_types ORDER BY sort_order;

          \echo '=== member -> types links ==='
          SELECT m.member_no, string_agg(mt.name, ', ' ORDER BY mt.name) AS types
          FROM public.member_member_types l
          JOIN public.members m ON m.id = l.member_id
          JOIN public.member_types mt ON mt.id = l.member_type_id
          GROUP BY m.member_no ORDER BY m.member_no;
          SQL
