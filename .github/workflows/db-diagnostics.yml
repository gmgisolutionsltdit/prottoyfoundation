name: DB diagnostics (read-only)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set."
            exit 1
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          \echo '=== does public.meetings exist? ==='
          SELECT EXISTS (
            SELECT 1 FROM information_schema.tables
            WHERE table_schema='public' AND table_name='meetings'
          ) AS meetings_table_exists;

          \echo '=== any meeting-prefixed tables at all? ==='
          SELECT table_name FROM information_schema.tables
          WHERE table_schema='public' AND table_name LIKE 'meeting%';
          SQL
