name: DB diagnostics (read-only)

# Manual only. Runs a fixed set of read-only SELECTs against the database and
# prints them to the run log, so data questions can be answered without giving
# anyone a direct connection. No inputs, no writes.

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set."
            exit 1
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          \echo '=== member 39 and 40 ==='
          SELECT member_no, joining_date, monthly_fee, is_active
          FROM public.members WHERE member_no IN (39, 40) ORDER BY member_no;

          \echo '=== member 39 transactions ==='
          SELECT f.code, t.for_month, t.amount, t.txn_date, t.id
          FROM public.transactions t
          JOIN public.members m ON m.id = t.member_id
          JOIN public.funds f ON f.id = t.fund_id
          WHERE m.member_no = 39
          ORDER BY t.for_month;

          \echo '=== member 39 subscriptions ==='
          SELECT f.code, s.monthly_amount, s.start_date
          FROM public.member_fund_subscriptions s
          JOIN public.members m ON m.id = s.member_id
          JOIN public.funds f ON f.id = s.fund_id
          WHERE m.member_no = 39;
          SQL
