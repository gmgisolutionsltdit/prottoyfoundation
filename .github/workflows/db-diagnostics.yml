name: DB diagnostics (read-only)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set."
            exit 1
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          \echo '=== FULL DUMP: reg + monthly transactions, all members ==='
          SELECT m.member_no, f.code, t.for_month, t.amount, t.txn_date
          FROM public.transactions t
          JOIN public.members m ON m.id = t.member_id
          JOIN public.funds f ON f.id = t.fund_id
          WHERE f.code IN ('REGISTRATION','MONTHLY_FOUNDING','MONTHLY_GENERAL')
          ORDER BY m.member_no, f.code, t.for_month NULLS FIRST;

          \echo '=== members core fields ==='
          SELECT member_no, joining_date, monthly_fee, is_active
          FROM public.members ORDER BY member_no;
          SQL
