name: DB diagnostics (read-only)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set."
            exit 1
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          \echo '=== first 20 members, for name-matching a meeting attendance import ==='
          SELECT member_no, full_name FROM public.members ORDER BY member_no LIMIT 20;
          SQL
