name: DB diagnostics (read-only)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set."
            exit 1
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
          \echo '=== member 40 core ==='
          SELECT member_no, joining_date, monthly_fee, is_active,
                 to_char(created_at,'YYYY-MM-DD HH24:MI') AS created,
                 to_char(updated_at,'YYYY-MM-DD HH24:MI') AS updated
          FROM public.members WHERE member_no = 40;

          \echo '=== member 40 transactions ==='
          SELECT f.code, t.for_month, t.amount, t.txn_date, t.description,
                 to_char(t.created_at,'YYYY-MM-DD HH24:MI') AS created
          FROM public.transactions t
          JOIN public.members m ON m.id = t.member_id
          JOIN public.funds f ON f.id = t.fund_id
          WHERE m.member_no = 40
          ORDER BY t.for_month NULLS FIRST;

          \echo '=== member 40 subscriptions ==='
          SELECT f.code, s.monthly_amount, s.start_date
          FROM public.member_fund_subscriptions s
          JOIN public.members m ON m.id = s.member_id
          JOIN public.funds f ON f.id = s.fund_id
          WHERE m.member_no = 40;

          \echo '=== member 39 audit log entries (deletes/updates) ==='
          SELECT to_char(a.created_at,'YYYY-MM-DD HH24:MI') AS created, a.action,
                 a.for_month, a.previous_amount, a.new_amount,
                 a.previous_data, a.new_data, a.source_file
          FROM public.transaction_audit_logs a
          JOIN public.members m ON m.id = a.member_id
          WHERE m.member_no = 39
          ORDER BY a.created_at;

          \echo '=== member 40 audit log entries ==='
          SELECT to_char(a.created_at,'YYYY-MM-DD HH24:MI') AS created, a.action,
                 a.for_month, a.previous_amount, a.new_amount,
                 a.previous_data, a.new_data, a.source_file
          FROM public.transaction_audit_logs a
          JOIN public.members m ON m.id = a.member_id
          WHERE m.member_no = 40
          ORDER BY a.created_at;

          \echo '=== headline counts ==='
          SELECT (SELECT count(*) FROM public.members) AS members,
                 (SELECT count(*) FROM public.transactions) AS all_txns;
          SQL
